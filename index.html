  --ok: #2b7a4b; --ok-soft: #dcefe3; --warn: #a96400; --warn-soft: #f7e8cf; --bad: #b0281f; --bad-soft: #f6dbd8; --na: #67747d; --na-soft: #e5e9ec;
  --rail: #ffffff; --rail-2: #f1f4f9; --rail-ink: #2a3954; --rail-ink-2: #8590a2; --rail-hi: #B31942;
  --paper: #ffffff; --paper-ink: #1a1a1a;
  --f-display: "Saira Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --f-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "SFMono-Regular", monospace;
  --r: 6px; --shadow: 0 1px 2px rgba(10, 30, 60, .06), 0 4px 14px rgba(10, 30, 60, .06);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.rail { background: var(--rail); border-right: 1px solid var(--line); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
.brand { padding: 26px 22px 20px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.brand-flag { width: 34px; height: auto; grid-row: span 2; box-shadow: 0 1px 2px rgba(10, 30, 60, .25); }
.brand b { font: 700 21px/1 var(--f-serif); letter-spacing: -.01em; color: var(--flag-navy); }
.brand b span { color: var(--flag-red); font: 600 12px var(--f-body); letter-spacing: .08em; vertical-align: 3px; margin-left: 2px; }
.brand small { display: block; margin-top: 4px; font-size: 10.5px; color: var(--rail-ink-2); line-height: 1.35; }
.nav { padding: 4px 12px 18px; display: flex; flex-direction: column; gap: 2px; }
.nav h4 { margin: 20px 10px 6px; font: 700 10px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--rail-ink-2); }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; color: var(--rail-ink); font-size: 13.5px; transition: background .15s, color .15s; }
.nav button:hover { background: var(--rail-2); color: var(--flag-navy); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--flag-navy); font-weight: 600; box-shadow: inset 3px 0 0 var(--flag-red); border-radius: 0 4px 4px 0; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .ct { margin-left: auto; font: 600 11px var(--f-mono); color: var(--rail-ink-2); }
.nav .ct.hot { color: var(--rail-hi); }
.rail-foot { margin-top: auto; padding: 16px 22px 20px; border-top: 1px solid var(--line-2); line-height: 1.45; font-size: 11px; color: var(--rail-ink-2); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 28px; background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .menu { display: none; }
.top label { white-space: nowrap; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
.top select { min-width: 0; max-width: 260px; }
.top .grow { flex: 1; }
.role-chip { font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--flag-navy); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.work { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 0 80px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; padding-top: 30px; }

.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-h h1 { font: 700 34px/1.15 var(--f-serif); letter-spacing: -.015em; color: var(--flag-navy); }
.page-h p { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.eyebrow { font: 700 11px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--flag-red); margin-bottom: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { cursor: pointer; border: 1px solid #c5cdd9; background: #fff; color: var(--flag-navy); padding: 8px 15px; border-radius: 3px; transition: border-color .15s, background .15s, color .15s; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--flag-navy); border-color: var(--flag-navy); color: #fff; }
.btn.pri:hover { background: #134a8c; border-color: #134a8c; color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

input[type=text], input[type=number], input[type=date], input[type=email], input:not([type]), select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[readonly], textarea[readonly], select:disabled, input:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }

.card { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 20px 0 0; min-width: 0; }
.card > h2, .card-h h2 { font: 600 19px/1.25 var(--f-serif); color: var(--flag-navy); letter-spacing: -.005em; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h p { margin: 2px 0 0; color: var(--ink-3); font-size: 12.5px; }
.grid { display: grid; gap: 28px 40px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.span2 { grid-column: span 2; }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.stat .v { font: 600 34px/1.05 var(--f-serif); color: var(--flag-navy); font-variant-numeric: tabular-nums lining-nums; }
.stat .s { font-size: 12.5px; color: var(--ink-2); }
.v.bad { color: var(--bad); } .v.ok { color: var(--ok); } .v.warn { color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--na-soft); color: var(--na); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.brass { background: var(--brass-soft); color: var(--brass); }
.pts { font: 700 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pts.p5 { border-color: var(--bad); color: var(--bad); } .pts.p3 { border-color: var(--warn); color: var(--warn); }

.banner { display: flex; gap: 14px; align-items: flex-start; background: transparent; border: 0; border-left: 3px solid var(--flag-red); padding: 2px 0 2px 18px; color: var(--ink); }
.banner b { color: var(--flag-red); }
.banner ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }
.banner .x { margin-left: auto; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--ink); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }

.tbl-wrap { overflow-x: auto; border: 0; border-radius: 0; background: transparent; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--ink); background: transparent; white-space: nowrap; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--surface-2); }
table.t td input, table.t td select { padding: 4px 7px; font-size: 12.5px; }

.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fld > em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 14px; }
.form .wide { grid-column: 1 / -1; }
fieldset { border: 0; padding: 0; margin: 0; }
.sec-t { font: 600 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 6px 0 10px; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.seg button { all: unset; cursor: pointer; padding: 3px 9px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"].m { background: var(--ok-soft); color: var(--ok); }

<script>
/* CERT V2.0 engine: SPRS rules engine, POA&M eligibility, readiness gate, quoting, demo seed. Pure functions over state. */
(function () {
  'use strict';
  const FW = window.CERT_FW;
  const DAY = 86400000;

  const iso = d => new Date(d).toISOString().slice(0, 10);
  const addDays = (d, n) => iso(new Date(d).getTime() + n * DAY);
  const daysUntil = d => Math.round((new Date(d).getTime() - new Date(iso(Date.now())).getTime()) / DAY);

  function weightOf(id, M) {
    const o = M.weightOverrides && M.weightOverrides[id];
    return o === undefined || o === '' ? FW.REQ[id].weight : Number(o);
  }

  function rec(org, id) { return (org.l2 && org.l2[id]) || { status: 'not_assessed' }; }

  // Effective status after applying methodology treatment for partial / unassessed / needs-review.
  function effective(id, r, M) {
    const s = r.status || 'not_assessed';
    if (s === 'implemented' || s === 'na') return 'met';
    if (s === 'partial' && r.partialCredit && M.partialCredit[id]) return 'partial_credit';
    if (s === 'partial') return M.partialCountsAs === 'met' ? 'met' : 'not_met';
    if (s === 'not_assessed') return M.notAssessedCountsAs === 'met' ? 'met' : 'not_met';
    if (s === 'needs_review') return M.needsReviewCountsAs === 'met' ? 'met' : 'not_met';
    return 'not_met';
  }

  function deductionFor(id, r, M) {
    const e = effective(id, r, M);
    if (e === 'met') return 0;
    if (e === 'partial_credit') return Number(M.partialCredit[id].deduct);
    return weightOf(id, M);
  }

  function poamEligibility(id, r, M) {
    const c = M.conditional;
    if (c.neverPoam.includes(id)) return { ok: false, why: 'Listed in 32 CFR 170.21 as not POA&M-eligible' };
    const d = deductionFor(id, r, M);
    if (d <= c.maxPoamWeight) return { ok: true, why: d + '-point requirement' };
    if (c.partialExceptions.includes(id) && effective(id, r, M) === 'partial_credit') return { ok: true, why: 'Allowed exception (encryption in place, FIPS validation pending)' };
    return { ok: false, why: d + '-point requirement: must be fully met before assessment' };
  }

  function scoreL2(org, M) {
    let score = M.maxScore;
    const deductions = [];
    const counts = { implemented: 0, partial: 0, not_implemented: 0, na: 0, needs_review: 0, not_assessed: 0 };
    FW.REQS.forEach(q => {
      const r = rec(org, q.id);
      counts[r.status || 'not_assessed']++;
      const d = deductionFor(q.id, r, M);
      if (d > 0) {
        score -= d;
        deductions.push({ id: q.id, deduct: d, status: r.status || 'not_assessed', elig: poamEligibility(q.id, r, M) });
      }
    });
    deductions.sort((a, b) => b.deduct - a.deduct || a.id.localeCompare(b.id, undefined, { numeric: true }));
    const sspRec = rec(org, M.sspRequirement);
    const sspOk = sspRec.status === 'implemented';
    const blocked = M.sspBlocksScore && !sspOk;
    const ineligible = deductions.filter(d => !d.elig.ok);
    const conditionalOk = !blocked && score >= M.conditional.minScore && ineligible.length === 0;
    const finalOk = !blocked && deductions.length === 0;
    return { score, max: M.maxScore, min: M.minScore, deductions, counts, blocked, sspOk, ineligible, conditionalOk, finalOk, gap: M.maxScore - score };
  }

  function famStats(org, M) {
    return FW.FAMILIES.map(f => {
      const reqs = FW.REQS.filter(q => q.fam === f.code);
      let met = 0, pts = 0, lost = 0;
      reqs.forEach(q => {
        const r = rec(org, q.id);
        pts += weightOf(q.id, M);
        const d = deductionFor(q.id, r, M);
        lost += d;
        if (d === 0) met++;
      });
      return { fam: f, total: reqs.length, met, pts, lost };
    });
  }

  function objectiveStats(org) {
    let total = 0, met = 0, evidenced = 0;
    const approvedByObj = new Set();
    (org.evidence || []).forEach(e => {
      if (e.reviewStatus !== 'approved' || isExpired(e)) return;
      (e.objectiveIds || []).forEach(o => approvedByObj.add(o));
    });
    FW.REQS.forEach(q => {
      const r = rec(org, q.id);
      q.objectives.forEach(o => {
        total++;
        const key = q.id + '[' + o.k + ']';
        const v = r.objectives && r.objectives[o.k];
        if (v === 'met' || v === 'na' || ((r.status === 'implemented' || r.status === 'na') && !v)) met++;
        if (approvedByObj.has(key) || (r.status === 'na')) evidenced++;
      });
    });
    return { total, met, evidenced };
  }

  function isExpired(e) { return e.expiresAt && daysUntil(e.expiresAt) < 0; }

  function scoreL1(org) {
    const out = FW.L1.map(p => {
      const sts = p.reqs.map(id => rec(org, id).status || 'not_assessed');
      let status;
      if (sts.every(s => s === 'implemented' || s === 'na')) status = 'met';
      else if (sts.some(s => s === 'not_assessed') && sts.every(s => s !== 'not_implemented' && s !== 'partial')) status = 'not_assessed';
      else status = 'not_met';
      return { p, status, sts };
    });
    const met = out.filter(o => o.status === 'met').length;
    return { items: out, met, total: out.length, practicesMet: FW.L1_REQ_IDS.filter(id => ['implemented', 'na'].includes(rec(org, id).status)).length };
  }

  function scoreL3(org, M) {
    const l3 = org.l3 || {};
    const items = FW.L3.map(q => ({ q, r: l3[q.id] || { status: 'not_assessed' } }));
    const met = items.filter(i => i.r.status === 'implemented' || i.r.status === 'na').length;
    const pct = met / items.length;
    const unmet = items.filter(i => !(i.r.status === 'implemented' || i.r.status === 'na'));
    const blockers = unmet.filter(i => M.level3.neverPoam.includes(i.q.id));
    return { items, met, total: items.length, pct, conditionalOk: pct >= M.level3.minPct && blockers.length === 0, blockers };
  }

  function sspCompleteness(org) {
    const s = org.ssp || {};
    const fields = ['systemName', 'owner', 'securityOfficial', 'envDescription', 'cuiEnvironment', 'boundary', 'network', 'esps', 'interconnections', 'updateFrequency'];
    const filled = fields.filter(k => (s[k] || '').trim().length > 0).length;
    const impl = FW.REQS.filter(q => ((rec(org, q.id).impl) || '').trim().length > 20).length;
    return { fields: fields.length, filled, impl, implTotal: FW.REQS.length, pct: (filled / fields.length) * 0.4 + (impl / FW.REQS.length) * 0.6 };
  }

  function policyStats(org) {
    const p = org.policies || {};
    const approved = FW.FAMILIES.filter(f => p[f.code] && p[f.code].status === 'approved' && !(p[f.code].reviewDue && daysUntil(p[f.code].reviewDue) < 0)).length;
    return { approved, total: FW.FAMILIES.length };
  }

  function evidenceStats(org) {
    const ev = (org.evidence || []).filter(e => e.kind !== 'program');   // SBA program documents are not CMMC evidence
    const pending = ev.filter(e => e.reviewStatus === 'pending' || e.reviewStatus === 'needs_info').length;
    const rejected = ev.filter(e => e.reviewStatus === 'rejected').length;
    const expired = ev.filter(isExpired).length;
    const soon = ev.filter(e => e.expiresAt && daysUntil(e.expiresAt) >= 0 && daysUntil(e.expiresAt) <= 30).length;
    const approved = ev.filter(e => e.reviewStatus === 'approved' && !isExpired(e)).length;
    return { total: ev.length, pending, rejected, expired, soon, approved };
  }

  function mockStats(org, M) {
    const m = (org.mock && org.mock.items) || {};
    const done = FW.REQS.filter(q => m[q.id] && m[q.id].finding).length;
    const notMet = FW.REQS.filter(q => m[q.id] && m[q.id].finding === 'not_met');
    const notMetBlocking = notMet.filter(q => !poamEligibility(q.id, rec(org, q.id), M).ok);
    return { done, total: FW.REQS.length, notMet: notMet.length, blocking: notMetBlocking.length, passed: done === FW.REQS.length && notMetBlocking.length === 0 };
  }

  function readiness(org, M) {
    const s = scoreL2(org, M);
    const obj = objectiveStats(org);
    const ssp = sspCompleteness(org);
    const pol = policyStats(org);
    const ev = evidenceStats(org);
    const mk = mockStats(org, M);
    const implCount = s.counts.implemented + s.counts.na;
    const openPoam = (org.poam || []).filter(p => !['closed', 'validated'].includes(p.status));
    const overduePoam = openPoam.filter(p => p.due && daysUntil(p.due) < 0);
    const g = org.gate || {};
    const rows = [
      { k: 'practices', label: '110 requirements', value: Math.round(implCount / 110 * 100) + '% implemented', ok: implCount === 110, partial: s.conditionalOk, detail: implCount + ' of 110 met or not applicable' },
      { k: 'objectives', label: 'Assessment objectives', value: Math.round(obj.evidenced / obj.total * 100) + '% evidence mapped', ok: obj.evidenced === obj.total, detail: obj.evidenced + ' of ' + obj.total + ' objectives have approved, current evidence' },
      { k: 'ssp', label: 'System Security Plan', value: ssp.pct >= 0.999 ? 'Complete' : Math.round(ssp.pct * 100) + '% complete', ok: ssp.pct >= 0.999 && s.sspOk, detail: ssp.filled + '/' + ssp.fields + ' plan sections, ' + ssp.impl + '/110 implementation statements' },
      { k: 'poam', label: 'POA&M', value: s.finalOk ? 'No open items' : (s.conditionalOk ? 'Acceptable (conditional)' : 'Not acceptable'), ok: s.finalOk || (s.conditionalOk && overduePoam.length === 0), detail: openPoam.length + ' open, ' + overduePoam.length + ' overdue, ' + s.ineligible.length + ' not POA&M-eligible' },
      { k: 'policies', label: 'Policies', value: pol.approved + '/' + pol.total + ' approved', ok: pol.approved === pol.total, detail: 'All 14 family policies approved and within review date' },
      { k: 'evidence', label: 'Evidence', value: ev.pending + ev.rejected + ev.expired === 0 && ev.total > 0 ? 'Complete' : (ev.pending + ' pending · ' + ev.expired + ' expired'), ok: ev.total > 0 && ev.pending + ev.rejected + ev.expired === 0, detail: ev.approved + ' approved artifacts, ' + ev.rejected + ' rejected' },
      { k: 'tech', label: 'Technical validation', value: g.technical ? 'Complete' : 'Not signed', ok: !!g.technical, detail: g.technical ? 'Signed by ' + g.technical.by + ' on ' + g.technical.at : 'Engineering lead validates configurations against the SSP' },
      { k: 'mock', label: 'Mock assessment', value: mk.passed ? 'Passed' : (mk.done + '/110 tested'), ok: mk.passed, detail: mk.notMet + ' NOT MET findings, ' + mk.blocking + ' blocking' },
      { k: 'mgmt', label: 'Management review', value: g.management ? 'Complete' : 'Not signed', ok: !!g.management, detail: g.management ? 'Signed by ' + g.management.by + ' on ' + g.management.at : 'Senior official reviews results and accepts residual risk' }
    ];
    const passed = rows.filter(r => r.ok).length;
    return { rows, passed, total: rows.length, ready: passed === rows.length, score: s, pct: passed / rows.length };
  }

  // Create/refresh POA&M items from deficiencies. Never deletes; marks fixed items for validation.
  function syncPoam(org, M, user) {
    org.poam = org.poam || [];
    const open = {};
    org.poam.forEach(p => { if (!['closed', 'validated'].includes(p.status)) open[p.reqId] = p; });
    let created = 0;
    FW.REQS.forEach(q => {
      const r = rec(org, q.id);
      const deficient = r.status === 'not_implemented' || r.status === 'partial';
      if (deficient && !open[q.id]) {
        const elig = poamEligibility(q.id, r, M);
        const svc = FW.SERVICES.find(s => s.id === FW.SERVICE_FOR[q.id]);
        org.poam.push({
          id: 'poam_' + Math.random().toString(36).slice(2, 9), reqId: q.id,
          deficiency: (r.status === 'partial' ? 'Partially implemented: ' : 'Not implemented: ') + q.text,
          rootCause: r.remediation ? '' : 'To be determined during remediation planning',
          corrective: r.remediation || (svc ? svc.name : 'Implement and document the requirement'),
          owner: r.owner || '', priority: q.weight >= 5 ? 'High' : q.weight === 3 ? 'Medium' : 'Low',
          due: r.due || addDays(Date.now(), elig.ok ? M.conditional.closeoutDays : 90),
          requiredEvidence: q.examine.slice(0, 3).join('; '), status: 'open', validation: '', closedAt: '',
          createdAt: iso(Date.now()), createdBy: user || 'CERT', eligible: elig.ok, source: 'auto'
        });
        created++;
      } else if (!deficient && open[q.id] && (r.status === 'implemented' || r.status === 'na') && open[q.id].status !== 'complete') {
        open[q.id].status = 'complete';
        open[q.id].note = 'Requirement marked implemented; awaiting validation';
      }
    });
    org.poam.forEach(p => { if (!['closed', 'validated'].includes(p.status)) p.eligible = poamEligibility(p.reqId, rec(org, p.reqId), M).ok; });
    return created;
  }

  function sizeTier(intake) {
    const emp = Number(intake.employees || 0), ep = Number(intake.endpoints || 0);
    if (emp > 250 || ep > 300 || Number(intake.locations || 1) > 3) return { id: 'large', mult: 2.4, label: 'Complex / multi-site' };
    if (emp > 50 || ep > 75) return { id: 'mid', mult: 1.4, label: 'Mid-size' };
    return { id: 'small', mult: 0.8, label: 'Small' };
  }

  function recommendLevel(intake) {
    const notes = [];
    let level = 0;
    const req = (intake.cmmcRequirement || '').toLowerCase();
    if (intake.cui === 'yes') level = 2; else if (intake.fci === 'yes') level = 1;
    if (req.includes('level 3')) level = 3;
    else if (req.includes('level 2') && level < 2) { level = 2; notes.push('Contract names Level 2 even though CUI is not confirmed. Confirm CUI with the contracting officer or prime.'); }

  const r100 = n => Math.round(n / 100) * 100;
  // Workstream price scales with how much of that workstream is failing, then by organization size.
  function quote(org, M) {
    const tier = sizeTier(org.intake || {});
    const s = scoreL2(org, M);
    const lines = [];
    const bySvc = {};
    const l1 = org.level === 1;
    s.deductions.forEach(d => {
      if (l1 && !FW.L1_REQ_IDS.includes(d.id)) return;

      (bySvc[sid] = bySvc[sid] || []).push(d.id);
    });

      const reqs = bySvc[svc.id];
      if (!reqs) return;
      const pts = reqs.reduce((a, id) => a + s.deductions.find(d => d.id === id).deduct, 0);
      const frac = Math.min(1, reqs.length / svc.reqs.length);
      const base = Math.max(750, svc.hi * frac) * tier.mult;
      lines.push({ svc, reqs, pts, lo: r100(base * 0.9), hi: r100(base * 1.15), mrr: Math.round(svc.mrr * tier.mult / 50) * 50 });
    });
    lines.sort((a, b) => b.pts - a.pts);
    const fixLo = lines.reduce((a, l) => a + l.lo, 0), fixHi = lines.reduce((a, l) => a + l.hi, 0);
    const mrr = lines.reduce((a, l) => a + l.mrr, 0);
    return { tier, lines, fixLo, fixHi, mrr, score: s, l1 };

  function poam(state, org) {

  function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

      '<section><h2>3. Roles and responsibilities</h2><ul><li><b>Policy owner:</b> ' + esc(org.ssp.securityOfficial || org.intake.securityContact || 'Security official') + '</li><li><b>Approving official:</b> ' + esc((org.intake.ownerName || 'Senior management') + (org.intake.ownerTitle ? ', ' + org.intake.ownerTitle : '')) + '</li><li><b>IT operations:</b> ' + esc(org.intake.itContact || 'IT lead') + ' implements technical controls and retains evidence.</li><li><b>All personnel:</b> comply with this policy and report suspected violations.</li></ul></section>' +

  // Printable certificate (landscape). Final only when the client is genuinely ready: Level 2/3 = all readiness-gate
  // checks pass; Level 1 = every FAR practice met. Otherwise it renders as a watermarked draft. It is never a CMMC
  // certification, and says so on its face.
  // Small business certification programs (SBA / VetCert): where each application stands. Never claims approval.
  function programs(state, org) {
    const P = FW.SB_PROGRAMS, recs = org.programs || {}, lab = (list, v) => (list.find(x => x[0] === (v || '')) || list[0])[1];
    const done = (r, d) => r.docs && r.docs[d[0]] && ['uploaded', 'submitted'].includes(r.docs[d[0]].status);
    const active = P.filter(p => recs[p.id] && recs[p.id].status);
    const rows = active.map(p => {
      const r = recs[p.id], elig = p.eligibility.filter(e => r.elig && r.elig[e[0]]).length, docs = p.docs.filter(d => done(r, d)).length;
      return '<tr><td><b>' + esc(p.short) + '</b><div class="d-small">' + esc(p.name) + '</div></td><td>' + esc(lab(FW.SB_STATUSES, r.status)) + '</td><td>' + elig + ' of ' + p.eligibility.length + '</td><td>' + docs + ' of ' + p.docs.length + '</td>' +
        '<td>' + esc(r.caseNo || '—') + '</td><td>' + esc(r.submitted || '—') + '</td><td>' + esc(r.certified || '—') + '</td><td>' + esc(r.renewal || '—') + '</td><td>' + esc(p.approves) + '</td></tr>';
    }).join('');
    const open = active.map(p => {
      const r = recs[p.id];
      const e = p.eligibility.filter(x => !(r.elig && r.elig[x[0]])).map(x => '<li>' + esc(x[1]) + '</li>').join('');
      const d = p.docs.filter(x => !done(r, x)).map(x => '<li>' + esc(x[1]) + '</li>').join('');
      return e || d ? '<h3>' + esc(p.short) + '</h3>' + (e ? '<p>Eligibility items not yet confirmed:</p><ul>' + e + '</ul>' : '') + (d ? '<p>Documents still needed:</p><ul>' + d + '</ul>' : '') : '';
    }).join('');
    const body = head(state, org, 'Small Business Certification Summary', 'SBA and VetCert programs') +
      '<section><p><b>Important:</b> ' + esc(FW.SB_APPROVAL_NOTE) + '</p><div class="d-scroll"><table class="d-table d-dense"><thead><tr><th>Program</th><th>Status</th><th>Eligibility</th><th>Documents</th><th>Case no.</th><th>Submitted</th><th>Certified</th><th>Renewal due</th><th>Approved by</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="9">No programs are being pursued yet.</td></tr>') + '</tbody></table></div></section>' + (open ? '<section><h2>Open items</h2>' + open + '</section>' : '') +
      '<footer class="d-foot"><p>' + esc(FW.SB_APPROVAL_NOTE) + ' Eligibility rules are summarized from 13 CFR Parts 124, 126, 127 and 128; confirm current requirements with the SBA before submitting.</p></footer>';
    return { title: 'Small Business Certification Summary', body };
  }

  function certificate(state, org) {
    const M = state.method, i = org.intake || {}, pv = (state.provider || {}).name || 'CERT V2.0', g = org.gate || {};
    const l1 = org.level === 1, R = E.readiness(org, M), L1 = E.scoreL1(org);
    const ready = l1 ? L1.met === L1.total : R.ready;
    const name = i.legalName || org.name, issued = E.iso(Date.now());
    let h = 5381; String(org.id + (i.cage || '')).split('').forEach(c => { h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; });
    const certNo = 'CRT-' + (i.cage || 'NOCAGE') + '-' + issued.replace(/-/g, '') + '-' + h.toString(36).slice(-4).toUpperCase();
    const level = l1 ? 'CMMC Level 1 · Self-assessment' : 'CMMC Level ' + org.level + ' · Assessment readiness';
    const title = l1 ? 'Certificate of Self-Assessment Completion' : 'Certificate of Assessment Readiness';
    const text = ready
      ? (l1 ? 'has completed its CMMC Level 1 self-assessment with ' + esc(pv) + ', meeting all ' + L1.total + ' FAR 52.204-21 safeguarding requirements, and is prepared for its annual affirmation in SPRS.'
            : 'has completed CMMC Level ' + org.level + ' readiness preparation with ' + esc(pv) + ', passed all ' + R.total + ' readiness checks, and is ready for independent assessment by an authorized ' + (org.level === 3 ? 'C3PAO and DIBCAC' : 'C3PAO') + '.')
      : (l1 ? 'is completing its CMMC Level 1 self-assessment with ' + esc(pv) + ': ' + L1.met + ' of ' + L1.total + ' requirements met so far.'
            : 'is preparing for CMMC Level ' + org.level + ' assessment with ' + esc(pv) + ': ' + R.passed + ' of ' + R.total + ' readiness checks complete so far.');
    const facts = [['CAGE code', i.cage || '—'], ['UEI', i.uei || '—'], l1 ? ['Requirements met', L1.met + ' of ' + L1.total] : ['SPRS score', R.score.score + ' of 110'],
      ['Scope', (org.ssp || {}).systemName || 'Organization-wide'], ['Issued', issued], ['Review by', E.addDays(Date.now(), M.affirmationCadenceDays || 365)]];
    const sign = (who, role) => '<div><b>' + esc(who || '') + '</b><span>' + esc(role) + '</span></div>';
    const body = '<div class="cert' + (ready ? '' : ' draft') + '"><div class="cert-frame">' +
      '<div class="cert-top"><span>' + esc(pv) + '</span><span>Certificate No. ' + esc(certNo) + '</span></div>' +
      '<div class="cert-kicker">' + esc(level) + '</div><div class="cert-title">' + title + '</div>' +
      '<p class="cert-lead">This recognizes that</p><p class="cert-name">' + esc(name) + '</p><p class="cert-text">' + text + '</p>' +
      '<dl class="cert-facts">' + facts.map(f => '<div><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd></div>').join('') + '</dl>' +
      '<div class="cert-sign">' + sign(g.technical && g.technical.by, 'Readiness lead, ' + pv) + sign((g.management && g.management.by) || i.ownerName, 'Senior official, ' + name) + '</div>' +
      '<p class="cert-note">Not a CMMC certification. ' + (l1 ? 'CMMC Level 1 status is the organization\'s own self-assessment and annual affirmation in SPRS.' : 'CMMC Level 2 certification is issued only by an authorized C3PAO, and Level 3 by DCMA DIBCAC; results are recorded by the Department of Defense.') +
      ' Issued by ' + esc(pv) + ', an independent readiness provider not affiliated with or endorsed by the Department of Defense or the Cyber AB.</p>' +
      '</div></div>';
    return { title: title + (ready ? '' : ' (draft)'), body, landscape: true, final: ready };
  }

  window.CERT_DOCS = { sprsReport, ssp, poam, poamCsv, evidenceCsv, level1, policy, mockReport, readinessLetter, proposal, certificate, programs, DISCLAIMER };
})();

<script>
/* CERT V2.0 sign-in. Active only when the server sets CERT_CONFIG.authMode = 'oidc' (the hosted app); the offline
   app and the local dev server skip it.

   Auth0 Universal Login with authorization code + PKCE (auth0-spa-js, loaded by the server with an integrity hash).
   Two-step verification is enforced by the Auth0 Login Actions (see docs/go-live.md) and again by the API, which
   rejects tokens that do not carry an MFA claim. Accounts are invitation-only: Auth0 proves who someone is; the
   CERT server decides whether that email has an account.

   Exposes window.CERT_AUTH = { ready, signOut, denied }. ready resolves once the person is signed in; until then
   this file owns the page and shows the sign-in screen. */
(function () {
  'use strict';
  const CFG = window.CERT_CONFIG || {};
  if (CFG.authMode !== 'oidc') return;
  const O = CFG.oidc || {};
  const home = location.origin + '/app/';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let client = null;

  function screen(title, text, actions, note) {
    const root = document.getElementById('app');
    root.innerHTML = '<div class="signin"><main class="signin-main"><div class="signin-brand">CERT V2.0<span>CMMC compliance &amp; assessment readiness</span></div>' +
      '<h1>' + esc(title) + '</h1><p class="signin-text">' + text + '</p><div class="actions">' + actions + '</div>' +
      (note ? '<p class="signin-note">' + note + '</p>' : '') + '</main>' +
      '<footer class="signin-foot">Independent readiness platform. Not affiliated with or endorsed by the U.S. Department of Defense, the Cyber AB or any government agency. CERT does not issue CMMC certifications. Do not upload CUI.</footer></div>';
    root.querySelectorAll('[data-auth]').forEach(b => b.addEventListener('click', () => act(b.getAttribute('data-auth'))));
  }

  function act(a) {
    if (a === 'signin') client.loginWithRedirect();
    else if (a === 'signup') client.loginWithRedirect({ authorizationParams: { screen_hint: 'signup' } });
    else if (a === 'signout') signOut();
    else if (a === 'reload') location.replace(home);
  }

  function signInScreen(err) {
    screen('Sign in to CERT',
      'Your CMMC readiness program: SPRS score, evidence vault, POA&amp;M, SSP and assessment readiness, in one place.',
      '<button type="button" class="btn pri signin-btn" data-auth="signin">Sign in</button><button type="button" class="btn signin-btn" data-auth="signup">First time? Create your login</button>',
      (err ? '<b>' + esc(err) + '</b><br>' : '') + 'Access is by invitation. Use the email address your CERT administrator invited. Two-step verification is required every time you sign in.');
  }

  function signOut() {
    try { localStorage.removeItem('cert-api-org'); } catch (e) { /* storage blocked */ }
    if (client) client.logout({ logoutParams: { returnTo: home } });
    else location.replace(home);
  }

  // Signed in with Auth0 but no CERT account (403), or the session ended (401).
  function denied(message, status) {
    if (status === 401) {
      screen('Please sign in again', 'Your session has ended or needs two-step verification.', '<button type="button" class="btn pri signin-btn" data-auth="signin">Sign in</button>');
      return;
    }
    screen('No CERT account for this sign-in', esc(message || 'This email address has not been invited.'),
      '<button type="button" class="btn pri signin-btn" data-auth="signout">Sign out and use another email</button>',
      'Ask your CERT administrator to add your email address under Settings → Users.');
  }

  async function getToken() {
    try {
      return await client.getTokenSilently();
    } catch (e) {
      if (['login_required', 'missing_refresh_token', 'invalid_grant', 'consent_required'].includes(e.error)) {
        await client.loginWithRedirect();
        return new Promise(() => {});   // the page is leaving for Auth0
      }
      throw e;
    }
  }

  async function start() {
    if (!window.auth0 || typeof window.auth0.createAuth0Client !== 'function' || !O.issuer || !O.clientId) {
      screen('Sign-in is not available', 'The sign-in service could not load. Check your internet connection and reload. If this keeps happening, the site is not fully configured yet.', '<button type="button" class="btn pri" data-auth="reload">Reload</button>');
      return new Promise(() => {});
    }
    client = await window.auth0.createAuth0Client({
      domain: new URL(O.issuer).host, clientId: O.clientId, useRefreshTokens: true, cacheLocation: 'localstorage',
      authorizationParams: { audience: O.audience, redirect_uri: home, scope: 'openid profile email offline_access' }
    });
    const q = new URLSearchParams(location.search);
    let err = '';
    if (q.has('error')) {
      err = q.get('error_description') || q.get('error');
      history.replaceState(null, '', home);
    } else if (q.has('code') && q.has('state')) {
      try { await client.handleRedirectCallback(); } catch (e) { err = 'Sign-in did not complete: ' + (e.error_description || e.message); }
      history.replaceState(null, '', home + location.hash);
    }
    if (!err && await client.isAuthenticated()) {
      CFG.getToken = getToken;
      return;
    }
    signInScreen(err);
    return new Promise(() => {});
  }

  window.CERT_AUTH = { ready: start(), signOut, denied };
})();

</script>
<script>
/* CERT V2.0 storage adapter. app.js talks only to window.CERT_STORE; views never touch storage.

   local (default): the whole state object in IndexedDB 'cert-v2' (store 'kv', key 'state'), evidence bytes in
     store 'files'. Same behaviour as the original local-first build.
   api: state comes from GET /api/bootstrap (same shape, filtered by the server's RBAC). Each save() is diffed
     against the last state the server confirmed and sent as REST calls; evidence bytes are uploaded to the
     server, which re-hashes (SHA-256) and encrypts them. Errors resync from the server.

   Choose api mode with window.CERT_CONFIG = { storage: 'api', apiBase: '' } (the server injects this at /app/)
   or by opening index.html?api=http://localhost:8000. Sign-in: CERT_CONFIG.getToken() returning an OIDC access
   token in deployed environments; "dev:<userId>" tokens against a local dev server. */
(function () {
  'use strict';
  const E = window.CERT_ENGINE;
  const CFG = Object.assign({ storage: 'local', apiBase: '' }, window.CERT_CONFIG || {});
  try { const q = new URLSearchParams(location.search); if (q.get('api') !== null) { CFG.storage = 'api'; CFG.apiBase = q.get('api').replace(/\/$/, ''); } } catch (e) { /* no URL */ }
  const uid = p => p + '_' + Math.random().toString(36).slice(2, 10);
  const clone = x => JSON.parse(JSON.stringify(x));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const enc = encodeURIComponent;
  const byId = list => { const m = {}; (list || []).forEach(x => { m[x.id] = x; }); return m; };
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };

  // ---------- SHA-256 (WebCrypto, with a pure-JS fallback for file:// and old browsers) ----------
  async function sha256(buf) {
    try { if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', buf); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); } } catch (e) { /* fall through */ }
    return sha256js(new Uint8Array(buf));
  }
  function sha256js(bytes) {
    const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
    let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
    const W = new Uint32Array(64), r = (x, y) => (x >>> y) | (x << (32 - y));
    for (let i = 0; i < n; i += 64) {
      for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4);
      for (let t = 16; t < 64; t++) { const s0 = r(W[t - 15], 7) ^ r(W[t - 15], 18) ^ (W[t - 15] >>> 3), s1 = r(W[t - 2], 17) ^ r(W[t - 2], 19) ^ (W[t - 2] >>> 10); W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0; }
      let [a, b, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) { const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) >>> 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
      H = H.map((x, j) => (x + [a, b, c, d, e, f, g, h][j]) >>> 0);
    }
    return H.map(x => x.toString(16).padStart(8, '0')).join('');
  }

  // Evidence record fields after a new upload or version; identical in both modes.
  function versionFields(e, f, hash, fileId, m) {
    e.versions = e.versions || [];
    e.versions.unshift({ version: e.version, sha256: e.sha256, fileId: e.fileId, uploadedAt: e.uploadedAt, uploadedBy: e.uploadedBy });
    return Object.assign(e, { version: e.version + 1, sha256: hash, fileId, size: f.size, mime: f.type, uploadedBy: m.uploadedBy, uploadedAt: E.iso(Date.now()), reviewStatus: 'pending', reviewer: '', reviewedAt: '', expiresAt: m.expiresAt, demo: false });
  }

  // ---------- local mode: IndexedDB ----------
  const IDB = {
    db: null, mem: { kv: {}, files: {} },
    open() {
      return new Promise(res => {
        try {
          const r = indexedDB.open('cert-v2', 1);
          r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
          r.onsuccess = () => { IDB.db = r.result; res(); };
          r.onerror = () => res();
        } catch (e) { res(); }
      });
    },
    get(store, key) {
      if (!IDB.db) return Promise.resolve(IDB.mem[store][key]);
      return new Promise(res => { try { const q = IDB.db.transaction(store).objectStore(store).get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(IDB.mem[store][key]); } });
    },
    put(store, key, val) {
      IDB.mem[store][key] = val;
      if (!IDB.db) return Promise.resolve();
      return new Promise(res => { try { const t = IDB.db.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
    }
  };

  const Local = {
    mode: 'local', requiresCuiAttestation: false, canSwitchUser: true, canResetDemo: true,
    open: () => IDB.open(),
    async load() { try { const s = await IDB.get('kv', 'state'); return s && s.v === 2 ? s : null; } catch (e) { return null; } },
    save(S) { return IDB.put('kv', 'state', clone(S)); },
    describe: () => 'Data stays in this browser' + (IDB.db ? '' : ' session') + '.',
    filesNote: () => 'Files stay in this browser.',
    async addEvidence(o, f, m) {
      const buf = await f.arrayBuffer(), hash = await sha256(buf), fileId = uid('file');
      await IDB.put('files', fileId, new Blob([buf], { type: f.type || 'application/octet-stream' }));
      const e = { id: uid('ev'), name: f.name, type: m.type, reqIds: m.reqIds, objectiveIds: m.objectiveIds, size: f.size, mime: f.type, sha256: hash, fileId, version: 1, uploadedBy: m.uploadedBy, uploadedAt: E.iso(Date.now()), reviewer: '', reviewStatus: 'pending', reviewedAt: '', expiresAt: m.expiresAt, comments: m.comments, versions: [] };
      if (m.kind === 'program') Object.assign(e, { kind: 'program', program: m.program, docId: m.docId });
      o.evidence.push(e);
      return e;
    },
    async addEvidenceVersion(o, e, f, m) {
      const buf = await f.arrayBuffer(), hash = await sha256(buf), fileId = uid('file');
      await IDB.put('files', fileId, new Blob([buf], { type: f.type || 'application/octet-stream' }));
      return versionFields(e, f, hash, fileId, m);
    },
    async getEvidenceFile(o, e) { return e && e.fileId ? (await IDB.get('files', e.fileId)) || null : null; },
    importState: null, switchUser: null, onError() {},
    // The offline/demo app has no licensing: show it as a demo of an Enterprise license.
    license: () => ({ type: 'enterprise', label: 'Enterprise license (demo)', seats: null, clients: null, status: 'active', demo: true }),
    usage: () => null, siteOwner: () => false, request: null
  };

  // ---------- api mode: REST ----------
  const DOC = ['name', 'level', 'targetScore', 'plan', 'createdAt', 'intake', 'ssp', 'assets', 'gate', 'sel', 'supporting', 'l3', 'atp', 'affirmations', 'scoreHistory', 'handoff', 'programs'];
  const EV_META = ['name', 'type', 'reqIds', 'objectiveIds', 'expiresAt', 'comments', 'reviewStatus', 'reviewer', 'reviewedAt'];
  const USER_FIELDS = ['name', 'title', 'role', 'orgIds', 'consulted', 'email', 'active'];
  const pick = (o, ks) => { const r = {}; ks.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };
  let snap = null, meta = {}, chain = Promise.resolve(), gen = 0, errorHandler = () => {};

  async function token() {
    const g = CFG.getToken || (window.CERT_CONFIG || {}).getToken;   // set by auth.js after sign-in
    if (typeof g === 'function') return g();
    return 'dev:' + (ls.get('cert-api-identity') || CFG.devUser || 'u_admin');
  }
  async function api(method, path, body) {
    const h = { Authorization: 'Bearer ' + await token() };
    const isForm = typeof FormData !== 'undefined' && body instanceof FormData;
    if (body !== undefined && !isForm) h['Content-Type'] = 'application/json';
    const r = await fetch(CFG.apiBase + path, { method, headers: h, body: body === undefined ? undefined : isForm ? body : JSON.stringify(body) });
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { const j = await r.json(); if (j.detail) msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) { /* not JSON */ }
      const err = new Error(msg); err.status = r.status; throw err;
    }
    return r;
  }
  const json = async (m, p, b) => { const r = await api(m, p, b); return r.status === 204 ? null : r.json(); };

  function eachKey(a, b, fn) { a = a || {}; b = b || {}; Object.keys(a).forEach(k => { if (!same(a[k], b[k])) fn(k, a[k]); }); }
  function eachItem(a, b, fn) { const pb = byId(b); (a || []).forEach(v => { const q = pb[v.id]; if (!q) fn(v, true); else if (!same(v, q)) fn(v, false); }); }
  function newLog(a, b) {
    a = a || []; b = b || [];
    if (!b.length) return a.slice();
    const i = a.findIndex(x => same(x, b[0]));
    return i < 0 ? [] : a.slice(0, i);
  }

  // Turn the difference between two states into REST calls. Order matters: requirement records go before
  // the org document, because the server checks affirmations against the score those records produce.
  function diff(S, P) {
    const ops = [], po = byId(P.orgs);
    S.orgs.forEach(o => {
      const p = po[o.id], base = '/api/orgs/' + enc(o.id);
      if (!p) { ops.push(['POST', '/api/orgs', o]); return; }
      eachKey(o.l2, p.l2, (id, v) => ops.push(['PUT', base + '/requirements/' + enc(id), v]));
      eachItem(o.poam, p.poam, (v, isNew) => ops.push(isNew ? ['POST', base + '/poam', v] : ['PUT', base + '/poam/' + enc(v.id), v]));
      eachKey(o.policies, p.policies, (k, v) => ops.push(['PUT', base + '/policies/' + enc(k), v]));
      ['mock', 'independent'].forEach(kind => {
        const a = o[kind] || {}, b = p[kind] || {};
        if (!same(a.meta || {}, b.meta || {})) ops.push(['PUT', base + '/workpapers/' + kind + '/meta', a.meta || {}]);
        eachKey(a.items, b.items, (id, v) => ops.push(['PUT', base + '/workpapers/' + kind + '/items/' + enc(id), v]));
      });
      eachItem(o.requests, p.requests, (v, isNew) => ops.push(isNew ? ['POST', base + '/requests', v] : ['PATCH', base + '/requests/' + enc(v.id), v]));
      const pe = byId(p.evidence);
      (o.evidence || []).forEach(e => { const q = pe[e.id]; if (q && !same(pick(e, EV_META), pick(q, EV_META))) ops.push(['PATCH', base + '/evidence/' + enc(e.id), pick(e, EV_META)]); });
      const fresh = newLog(o.log, p.log);
      for (let i = 0; i < fresh.length; i += 100) ops.push(['POST', base + '/activity', { entries: fresh.slice(i, i + 100) }]);
      const patch = {};
      DOC.forEach(k => { if (!same(o[k], p[k])) patch[k] = o[k] === undefined ? null : o[k]; });
      if (Object.keys(patch).length) ops.push(['PATCH', base, patch]);
    });
    const so = byId(S.orgs);
    P.orgs.forEach(p => { if (!so[p.id]) ops.push(['DELETE', '/api/orgs/' + enc(p.id)]); });
    const me = (S.users || []).find(u => u.id === S.currentUser);
    if (me && me.role === 'admin') {   // only admins manage users; everyone else's list is read-only
      const pu = byId(P.users);
      (S.users || []).forEach(u => { const q = pu[u.id]; if (!q) ops.push(['POST', '/api/users', Object.assign({ id: u.id }, pick(u, USER_FIELDS))]); else if (!same(pick(u, USER_FIELDS), pick(q, USER_FIELDS))) ops.push(['PATCH', '/api/users/' + enc(u.id), pick(u, USER_FIELDS)]); });
    }
    ['method', 'provider', 'reg', 'partners'].forEach(k => { if (S[k] !== undefined && !same(S[k], P[k])) ops.push(['PUT', '/api/settings/' + k, S[k]]); });
    return ops;
  }

  function queue(work) {
    const g = gen;
    chain = chain.then(async () => {
      if (g !== gen) return;   // an earlier write failed and the state was reloaded; drop stale writes
      try { await work(); } catch (e) { gen++; errorHandler(e); }
    });
    return chain;
  }

  const Api = {
    mode: 'api', requiresCuiAttestation: true, canResetDemo: false,
    get canSwitchUser() { return meta.authMode === 'dev'; },
    async open() { /* nothing to open */ },
    async load() {
      const st = await json('GET', '/api/bootstrap');
      meta = st.meta || {};
      delete st.meta;
      // Dev only: offer every seeded identity in the "Signed in as" switcher.
      (meta.devIdentities || []).forEach(d => { if (!st.users.find(u => u.id === d.id)) st.users.push(Object.assign({ orgIds: [], consulted: [] }, d)); });
      const keep = ls.get('cert-api-org');
      if (keep && st.orgs.find(o => o.id === keep)) st.currentOrg = keep;
      snap = clone(st);
      return st;
    },
    save(S) {
      if (!snap) return chain;
      if (S.currentOrg) ls.set('cert-api-org', S.currentOrg);
      const ops = diff(S, snap);
      snap = clone(S);
      if (!ops.length) return chain;
      return queue(async () => { for (const [m, p, b] of ops) await api(m, p, b); });
    },

    return pill(cls, sbLabel(FW.SB_STATUSES, status));

  function progAlerts(o) {

      case 'download': {
        const ev = o.evidence.find(v => v.id === id);
        let blob;
        try { blob = await Store.getEvidenceFile(o, ev); } catch (err) { toast(err.message); return; }
        if (!blob) { toast('No stored file for this record'); return; }
        download(ev.name, blob); return;
      }
      case 'review': { const ev = o.evidence.find(v => v.id === id); ev.reviewStatus = x; ev.reviewer = user().name; ev.reviewedAt = E.iso(Date.now()); log(o, 'Evidence ' + ev.name + ' → ' + x); save(); toast('Marked ' + x.replace('_', ' ')); break; }
      case 'evf': ui.evf = x; break;
      case 'fulfil': { const rq = o.requests.find(v => v.id === id); rq.status = 'fulfilled'; log(o, 'Fulfilled evidence request for ' + rq.reqId); save(); break; }
      case 'reqEv': ui.modal = { type: 'prompt', title: 'Request additional evidence', text: FW.REQ[id].cmmc + ' · ' + FW.REQ[id].title, ok: 'Send request', fields: [{ k: 'text', label: 'What do you need?', type: 'textarea' }], onOk: v => { o.requests = o.requests || []; o.requests.unshift({ id: uid('rq'), reqId: id, text: v.text, by: user().name, at: E.iso(Date.now()), status: 'open' }); log(o, 'Assessor requested evidence for ' + FW.REQ[id].cmmc); toast('Request sent to the client\'s evidence vault'); } }; break;
      case 'syncPoam': { const n = E.syncPoam(o, M(), user().name); log(o, 'POA&M sync: ' + n + ' new items'); save(); toast(n ? n + ' POA&M items created' : 'POA&M already covers every deficiency'); break; }
      case 'poamToggle': ui.poamOpen = ui.poamOpen === id ? '' : id; break;
      case 'mode': ui.mode = x; break;
      case 'mfam': ui.mfam = x; break;
      case 'atp': o.atp = o.atp || {}; o.atp[id] = o.atp[id] || {}; o.atp[id].level = Number(x); save(); break;
      case 'whatIfAll': ui.whatIf = {}; E.scoreL2(o, M()).ineligible.forEach(d => { ui.whatIf[d.id] = true; }); break;
      case 'applyLevel': o.level = Number(x); log(o, 'Program level set to ' + x); save(); toast('Program set to Level ' + x); break;
      case 'addAsset': o.assets = o.assets || []; o.assets.push({ id: uid('a'), name: '', category: 'CUI asset', notes: '' }); save(); break;
      case 'delAsset': o.assets = o.assets.filter(v => v.id !== id); save(); break;
      case 'polDraft': o.policies = o.policies || {}; o.policies[id] = { status: 'draft', draftedBy: user().name, draftedAt: E.iso(Date.now()) }; log(o, 'Drafted ' + id + ' policy'); save(); break;
      case 'polApprove': o.policies[id] = Object.assign(o.policies[id] || {}, { status: 'approved', approvedBy: user().name, approvedAt: E.iso(Date.now()), reviewDue: E.addDays(Date.now(), 365) }); log(o, 'Approved ' + id + ' policy'); save(); break;
      case 'sign': ui.modal = { type: 'prompt', title: x === 'technical' ? 'Technical validation sign-off' : 'Management review sign-off', text: x === 'technical' ? 'I validated that configurations in the boundary match the SSP implementation statements.' : 'I reviewed the assessment results, POA&M and residual risk, and accept them on behalf of the organization.', ok: 'Sign', fields: [{ k: 'by', label: 'Full name and title', v: user().name + ', ' + user().title }], onOk: v => { o.gate = o.gate || {}; o.gate[x] = { by: v.by, at: E.iso(Date.now()) }; log(o, (x === 'technical' ? 'Technical validation' : 'Management review') + ' signed by ' + v.by); toast('Signed'); } }; break;
      case 'affirm': {
        const l1 = o.level === 1;
        ui.modal = { type: 'prompt', title: 'Record annual affirmation', text: 'The affirming official certifies to the government that the organization meets ' + (l1 ? 'all FAR 52.204-21 requirements' : 'its CMMC requirements') + '. Enter it in SPRS, then record it here.', ok: 'Record affirmation', fields: [{ k: 'by', label: 'Affirming official', v: o.intake.ownerName }, { k: 'title', label: 'Title', v: o.intake.ownerTitle }], onOk: v => { o.affirmations = o.affirmations || []; o.affirmations.unshift({ level: l1 ? 'Level 1 (Self)' : 'Level 2 (Self)', by: v.by, title: v.title, date: E.iso(Date.now()), score: l1 ? E.scoreL1(o).met + '/15' : E.scoreL2(o, M()).score, statement: 'Annual affirmation' }); log(o, 'Annual affirmation recorded by ' + v.by); toast('Affirmation recorded. Next due in ' + M().affirmationCadenceDays + ' days.'); } };
        break;
      }
      case 'addClient': {
        if (overLimit('clients')) { toast(overLimit('clients')); break; }
        const fresh = blankOrg(uid('org'));
        S.orgs.push(fresh); S.users.forEach(u => { if (u.id === S.currentUser && !u.orgIds.includes('*')) u.orgIds.push(fresh.id); });
        S.currentOrg = fresh.id; log(fresh, 'Client created'); save(); go('intake'); return;
      }
      case 'addUser': if (overLimit('users')) { toast(overLimit('users')); break; } S.users.push({ id: uid('u'), name: 'New user', title: '', email: '', role: 'client', active: true, orgIds: o ? [o.id] : [], consulted: [] }); save(); toast('User added. Enter their email address so they can sign in.'); break;
      case 'exportJson': { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); download('cert-v2-backup-' + E.iso(Date.now()) + '.json', blob); return; }
      case 'resetMethod': if (ui.confirm !== 'method') { ui.confirm = 'method'; break; } S.method = JSON.parse(JSON.stringify(FW.DEFAULT_METHOD)); ui.confirm = ''; save(); toast('Scoring rules reset to DoD default'); break;
      case 'removeOrg': if (!o) break; if (ui.confirm !== 'org') { ui.confirm = 'org'; break; } S.orgs = S.orgs.filter(v => v.id !== o.id); S.currentOrg = S.orgs[0] ? S.orgs[0].id : null; ui.confirm = ''; save(); toast('Client removed'); break;
      case 'resetDemo': if (!Store.canResetDemo) { toast('Demo reset is only available in the offline app'); break; } if (ui.confirm !== 'demo') { ui.confirm = 'demo'; break; } S = E.demoState(); ui.confirm = ''; save(); toast('Demo data restored'); go('dashboard'); return;
    }
    render();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) { ui.modal = null; ui.upload = null; render(); } });

  // ---------- Boot ----------
  function normalize(st) {
    st.partners = st.partners || [];
    st.users.forEach(u => { u.orgIds = u.orgIds || []; u.consulted = u.consulted || []; });
    st.orgs.forEach(o => { o.independent = o.independent || { items: {}, meta: {} }; o.requests = o.requests || []; o.mock = o.mock || { items: {}, meta: {} }; o.sel = o.sel || {}; });
    return st;
  }
  function fatal(msg) { root.innerHTML = '<div class="card" style="max-width:640px;margin:48px auto"><h2>CERT V2.0</h2><p>' + esc(msg) + '</p></div>'; }
  async function switchUser(id) {
    try {
      S = normalize(await Store.switchUser(id)); toast('Signed in as ' + user().name + ' (' + ROLES[user().role] + ')');
    } catch (e) { toast(e.message); }
    render.resetScroll = true; render();
  }
  (async function boot() {
    if (window.CERT_AUTH) {
      try { await window.CERT_AUTH.ready; } catch (e) { fatal('Sign-in failed: ' + (e.message || e)); return; }
    }
    await Store.open();
    let saved = null;
    try { saved = await Store.load(); } catch (e) {
      if (Store.mode === 'api') {
        if (window.CERT_AUTH && (e.status === 401 || e.status === 403)) { window.CERT_AUTH.denied(e.message, e.status); return; }
        fatal('Cannot load data from the CERT server: ' + e.message); return;
      }
    }
    S = normalize(saved || E.demoState());
    Store.onError(async e => {
      if (window.CERT_AUTH && e.status === 401) { window.CERT_AUTH.denied(e.message, 401); return; }
      toast('Not saved: ' + e.message + '. Reloaded from the server.');
      try { S = normalize(await Store.load()); } catch (x) { /* keep the local copy */ }
      render();
    });
    try { const h = (location.hash || '').replace('#', ''); if (VIEWS[h]) ui.route = h; } catch (e) { /* no hash */ }
    if (!saved) save();
    render();
    // An embedding host may provide downloads (build/embed.html sets CERT_HOST); otherwise documents offer Copy.
    if (FRAMED && window.CERT_HOST && typeof window.CERT_HOST.downloads === 'function') window.CERT_HOST.downloads().then(d => { DL = d; render(); }).catch(() => { DL = null; });
  })();
})();

</script>
